<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertil — Admin Console</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:  { DEFAULT: "#0e9488", dark: "#0c7a70", bright: "#2dd4bf", tint: "#0f3b35" },
            gold:   { DEFAULT: "#d8a13a", tint: "#3a2f12" },
            ink:    "#081d1a",
            panel:  "#0f322d",
            edge:   "#1d3b37",
            muted:  "#8aa39d",
            faint:  "#5f7a74",
            paper:  "#0c2724",
          },
          fontFamily: {
            display: ['"Space Grotesk"', "system-ui", "sans-serif"],
            sans: ['"Space Grotesk"', "system-ui", "sans-serif"],
            mono: ['"Space Mono"', "ui-monospace", "monospace"],
          },
          borderRadius: { xl2: "1rem" },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    html, body { overflow-x: clip; max-width: 100%; }
    body { font-family: 'Space Grotesk', system-ui, sans-serif; }
    h1,h2,h3,.font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #2a4a44; border-radius: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .8s linear infinite; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
    .fade-up { animation: fadeUp .25s ease both; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .vword { display:inline-flex; align-items:flex-end; font-weight:600; letter-spacing:-0.04em; line-height:.9; }
    .vi { display:inline-flex; flex-direction:column; align-items:center; justify-content:flex-end; height:.96em; margin:0 .05em .04em; }
    .vi-tip { width:0; height:0; border-left:.2em solid transparent; border-right:.2em solid transparent; border-bottom:.28em solid var(--vi,#2dd4bf); }
    .vi-stem { width:.135em; height:.5em; background:var(--vi,#2dd4bf); border-radius:.02em; margin-top:.025em; }

    /* ---- futuristic console chrome ---- */
    body { background:
      radial-gradient(900px 500px at 85% -10%, rgba(45,212,191,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(14,148,136,.12), transparent 60%),
      linear-gradient(rgba(45,212,191,.035) 1px, transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg, rgba(45,212,191,.035) 1px, transparent 1px) 0 0/34px 34px,
      #061714; background-attachment: fixed; }
    .glass { background: linear-gradient(160deg, rgba(17,52,47,.72), rgba(9,31,28,.78)); border: 1px solid rgba(45,212,191,.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.25); backdrop-filter: blur(10px); }
    .glass:hover { border-color: rgba(45,212,191,.22); }
    .side-glass { background: rgba(6,23,20,.72); border-right: 1px solid rgba(45,212,191,.12); backdrop-filter: blur(12px); }
    .top-glass { background: rgba(6,23,20,.7); backdrop-filter: blur(12px); }
    .hero-grid { background: radial-gradient(600px 200px at 100% 0%, rgba(45,212,191,.18), transparent 70%),
      linear-gradient(160deg, rgba(17,60,54,.85), rgba(8,30,27,.9)); }
    .kpi::after { content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
      background: linear-gradient(120deg, transparent 40%, rgba(45,212,191,.10), transparent 60%); }
    .glow-text { text-shadow: 0 0 18px rgba(45,212,191,.35); }
    .nav-item { width:100%; display:flex; align-items:center; gap:.75rem; padding:.6rem .75rem; border-radius:.8rem; font-size:.875rem; font-weight:500; color:#8aa39d; transition:all .15s; }
    .nav-item:hover { background: rgba(29,59,55,.45); color:#f1f5f9; }
    .nav-item.on { color:#2dd4bf; background: linear-gradient(90deg, rgba(45,212,191,.18), rgba(45,212,191,.04)); box-shadow: inset 2px 0 0 #2dd4bf; }
    .seg-group { display:inline-flex; gap:2px; padding:2px; border:1px solid #1d3b37; border-radius:.7rem; background: rgba(6,23,20,.6); }
    .seg { font-size:12px; font-weight:600; color:#8aa39d; padding:.38rem .7rem; border-radius:.6rem; border:1px solid #1d3b37; background: rgba(6,23,20,.5); transition:all .15s; white-space:nowrap; }
    .seg-group .seg { border-color: transparent; background: transparent; }
    .seg:hover { color:#fff; border-color: rgba(45,212,191,.35); }
    .seg.on { color:#04120f; background: linear-gradient(135deg,#2dd4bf,#14b8a6); border-color: transparent; box-shadow: 0 0 14px rgba(45,212,191,.35); }
    .ctool { font-size:11px; font-weight:600; color:#8aa39d; padding:.2rem .5rem; border-radius:.45rem; border:1px solid #1d3b37; }
    .ctool:hover { color:#fff; border-color: rgba(45,212,191,.4); }
    .ctool.on { color:#2dd4bf; border-color: rgba(45,212,191,.5); background: rgba(45,212,191,.1); }
    .chip { display:inline-flex; align-items:center; gap:.25rem; font-size:10.5px; font-weight:700; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; }
    .chip-up { color:#5eead4; background: rgba(45,212,191,.13); }
    .chip-down { color:#fda4af; background: rgba(251,113,133,.13); }
    .chip-flat { color:#a7bdb7; background: rgba(148,163,184,.12); }
    .chip-new { color:#fcd34d; background: rgba(216,161,58,.16); }
    .btn-glow { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-size:12.5px; font-weight:700; color:#04120f; padding:.55rem 1rem; border-radius:.7rem;
      background: linear-gradient(135deg,#2dd4bf,#0e9488); box-shadow: 0 0 18px rgba(45,212,191,.3); transition: all .15s; }
    .btn-glow:hover { filter: brightness(1.1); box-shadow: 0 0 26px rgba(45,212,191,.45); }
    .btn-glow:disabled { opacity:.5; cursor:not-allowed; }
    .btn-ghost { display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; color:#cfe3de; padding:.5rem .9rem; border-radius:.7rem; border:1px solid #1d3b37; }
    .btn-ghost:hover { border-color: rgba(45,212,191,.45); color:#fff; }
    .input { background: rgba(6,23,20,.7); border:1px solid #1d3b37; border-radius:.6rem; padding:.42rem .7rem; font-size:12.5px; color:#f1f5f9; outline:none; }
    .input:focus { border-color: rgba(45,212,191,.6); box-shadow: 0 0 0 3px rgba(45,212,191,.12); }
    .agent-orb { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:#2dd4bf; flex-shrink:0;
      background: radial-gradient(circle at 30% 30%, rgba(45,212,191,.35), rgba(14,148,136,.12)); border:1px solid rgba(45,212,191,.35); box-shadow: 0 0 20px rgba(45,212,191,.2); }
    .agent-card { transition: transform .15s, border-color .15s; } .agent-card:hover { transform: translateY(-2px); }
    .mini { border:1px solid #1d3b37; border-radius:.7rem; padding:.45rem .25rem; background: rgba(6,23,20,.5); }
    .mini-v { font-family:'Space Grotesk'; font-weight:800; font-size:18px; color:#fff; } .mini-l { font-size:10px; color:#5f7a74; text-transform:uppercase; letter-spacing:.05em; }
    .email-edit { background:#fff; color:#13312e; border-radius:.7rem; padding:.8rem 1rem; font-size:13px; line-height:1.55; outline:none; border:2px solid transparent; }
    .email-edit:focus { border-color:#2dd4bf; } .email-edit p { margin:0 0 .55rem; }
    .finding-body p { margin:.2rem 0; }
    .drawer { background: linear-gradient(180deg, #0b2724, #071a17); border-left:1px solid rgba(45,212,191,.2); box-shadow: -20px 0 60px rgba(0,0,0,.5); }
    @keyframes slideIn { from { transform: translateX(40px); opacity:0 } to { transform:none; opacity:1 } }
    .slide-in { animation: slideIn .22s ease both; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} } .fade-in { animation: fadeIn .18s ease both; }
    @keyframes pulseDot { 0%,100% { box-shadow:0 0 0 0 rgba(45,212,191,.6) } 50% { box-shadow:0 0 0 5px rgba(45,212,191,0) } }
    .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes loadBar { from { transform: translateX(-100%) } to { transform: translateX(300%) } }
    .loading-bar { animation: loadBar 1.1s ease-in-out infinite; box-shadow: 0 0 12px #2dd4bf; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .drop-hot { border-color: rgba(45,212,191,.7) !important; box-shadow: 0 0 0 2px rgba(45,212,191,.25), 0 0 30px rgba(45,212,191,.2); }
    .app-card:active { cursor: grabbing; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="h-full text-slate-100 antialiased">
  <div id="app" class="min-h-full"></div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='admin_charts.js') }}"></script>
  <script src="{{ url_for('static', filename='admin_agents.js') }}"></script>
  <script src="{{ url_for('static', filename='admin_apps.js') }}"></script>
  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
